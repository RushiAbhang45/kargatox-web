<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Clash Display',sans-serif;--font-body:'Satoshi',system-ui,sans-serif}
body{margin:0;background:#f7f6f3;color:#141a2b;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1f5fd6;text-decoration:none}
a:hover{color:#f26a1b}
h1,h2,h3,h4,p{margin:0}
</style>
</helmet>
<dc-import name="SiteHeader" active="faq" hint-size="100%,72px"></dc-import>

<section data-screen-label="FAQ" style="padding:110px 24px 120px">
  <div style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px 80px;align-items:start">
    <div style="display:grid;gap:18px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;color:#1f5fd6">BEFORE YOU ASK</div>
      <h1 style="font-family:var(--font-display);font-weight:600;font-size:clamp(40px,5vw,68px);line-height:1.02;letter-spacing:-0.03em">You have questions. <span style="color:#f26a1b">We have straight answers.</span></h1>
      <a href="Contact.dc.html" style="justify-self:start;margin-top:12px;background:#0b1430;color:#fff;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px" style-hover="background:#16244f;color:#fff">Ask us directly →</a>
    </div>
    <div data-stagger="1" style="border-top:1px solid #dcd8cf">
      <sc-for list="{{ faqs }}" as="f" hint-placeholder-count="4">
        <div style="border-bottom:1px solid #dcd8cf">
          <button onClick="{{ f.toggle }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;background:none;border:0;cursor:pointer;padding:26px 0;text-align:left;font-family:var(--font-display);font-size:22px;font-weight:600;color:#141a2b;letter-spacing:-0.01em">
            <span>{{ f.q }}</span>
            <span style="flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:20px;background:{{ f.iconBg }};color:{{ f.iconFg }}">{{ f.icon }}</span>
          </button>
          <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
            <p style="font-size:17px;line-height:1.65;color:#4a5370;padding:0 56px 28px 0;text-wrap:pretty">{{ f.a }}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</section>
<dc-import name="SiteFooter" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { faq: 0 };
  renderVals() {
    const faqs = [
      { q: 'What exactly do you do?', a: 'We fix what is stopping your revenue from growing, across three areas: leads, sales, and retention. We find what is broken, do the actual work to fix it, and leave you with a system your team can run. Not advice, not a deck, real work.' },
      { q: 'How fast can you start?', a: 'Quickly. You get a clear plan of what is broken and how we will fix it within 7 days of starting. Real changes follow in the weeks after.' },
      { q: 'Do you replace a full-time hire?', a: 'Often, yes, at least for a while. We also help you figure out whether you actually need that senior hire yet, and if you do, we help you hire the right person.' },
      { q: 'What does it cost?', a: 'Flat-fee engagements, scoped to your stage and what needs fixing. Roughly the cost of one senior hire, for a full team. We give you an exact number on the call, no hidden pricing.' }
    ].map((f, i) => {
      const open = this.state.faq === i;
      return { ...f, open, icon: open ? '−' : '+', iconBg: open ? '#f26a1b' : '#eceae4', iconFg: open ? '#fff' : '#141a2b', toggle: () => this.setState({ faq: open ? -1 : i }) };
    });
    return { faqs };
  }
}
</script>
</body>
</html>
