<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Clash Display',sans-serif;--font-body:'Satoshi',system-ui,sans-serif}
body{margin:0;background:#f7f6f3;color:#141a2b;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1f5fd6;text-decoration:none}
a:hover{color:#f26a1b}
h1,h2,h3,h4,p{margin:0}
</style>
</helmet>
<dc-import name="SiteHeader" active="process" hint-size="100%,72px"></dc-import>

<section data-screen-label="Process hero" style="background:#0b1430;color:#fff;position:relative;overflow:hidden">
  <div data-float="1" style="position:absolute;left:-200px;bottom:-280px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(242,106,27,0.3),rgba(242,106,27,0) 70%)"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:100px 24px 100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px 80px;align-items:end">
    <div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;color:#ff8a3d">HOW WE WORK</div>
      <h1 style="font-family:var(--font-display);font-weight:600;font-size:clamp(44px,6vw,88px);line-height:0.98;letter-spacing:-0.02em;margin-top:20px">We do the work.<br><span style="color:#6f9bff">You keep the system.</span></h1>
    </div>
    <div>
      <p style="font-size:20px;line-height:1.6;color:#c9d2ea">Here is exactly what happens after you say yes.</p>
      <p style="font-size:17px;line-height:1.6;color:#fff;margin-top:18px;padding:18px 20px;border-radius:14px;background:rgba(242,106,27,0.14);border:1px solid rgba(255,138,61,0.35)"><strong style="color:#ff8a3d">Straight up:</strong> If we are not the right fix for your problem, we will tell you on the first call.</p>
    </div>
  </div>
</section>

<section data-screen-label="Steps" style="padding:100px 24px 120px">
  <div data-stagger="1" style="max-width:1000px;margin:0 auto;display:grid">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
      <div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;padding:40px 0;border-top:1px solid #dcd8cf">
        <div style="font-family:var(--font-display);font-size:clamp(48px,6vw,80px);font-weight:600;line-height:0.9;color:#f26a1b;min-width:1.4em">{{ s.num }}</div>
        <div style="display:grid;gap:12px">
          <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline">
            <h2 style="font-family:var(--font-display);font-size:clamp(26px,3vw,36px);font-weight:600;letter-spacing:-0.02em">{{ s.title }}</h2>
            <span style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#1f5fd6;background:#e8eefc;padding:6px 12px;border-radius:999px;white-space:nowrap">{{ s.when }}</span>
          </div>
          <p style="font-size:18px;line-height:1.65;color:#4a5370;max-width:680px;text-wrap:pretty">{{ s.body }}</p>
        </div>
      </div>
    </sc-for>
  </div>
</section>
<dc-import name="SiteFooter" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const steps = [
      { title: 'We listen', when: 'Days 1 to 7', body: 'We sit in on your calls, talk to won and lost customers, and study your numbers. We learn what is actually happening before we touch anything.' },
      { title: 'You get the plan', when: 'Day 7', body: 'By day 7, you know exactly what is costing you revenue and the plan to fix it. Prioritized, clear, no fluff.' },
      { title: 'We build it', when: 'Weeks 2 to 8', body: 'We get into your CRM, your tools, your team. We do the actual work and wire the fixes into how you already operate.' },
      { title: 'We fix what is costing you', when: 'Weeks 4 to 10', body: 'Outbound, sales motion, retention systems, whatever the diagnosis called for. You see changes happening, not slides stacking up.' },
      { title: 'You keep the system', when: 'Weeks 11 to 12', body: "We hand over the playbooks, dashboards, and a clear hire-or-don't-hire call. Your team owns it from here. The growth stays when we go." }
    ].map((x, i) => ({ ...x, num: String(i + 1).padStart(2, '0') }));
    return { steps };
  }
}
</script>
</body>
</html>
